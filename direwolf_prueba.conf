# Configuración mínima para probar la recepción AX.25 de la Pico.
#
# Direwolf transmite un beacon de telemetría cada 60 segundos.
# Antes de usar por radio, copiar desde la configuración habitual las líneas
# ADEVICE, ARATE y PTT que ya funcionen con el equipo.

MYCALL UNCO-3
CHANNEL 0
MODEM 1200

CBEACON DELAY=0 EVERY=1:00 SENDTO=0 SOURCE=UNCO-3 DEST=NQNGND INFO="T#001,033,050,025,120,204,00000000"
